<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-card {
      width: 300px;
      padding: 26px 26px 22px;
      background: #111111;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-app-region: drag;
      position: relative;
    }

    .splash-logo {
      width: 200px;
      max-width: 100%;
      object-fit: contain;
      display: block;
      margin-bottom: 0;
      position: relative;
      z-index: 2;
    }

    .dangle-wrap {
      display: flex;
      justify-content: center;
      height: 90px;
      margin-top: 0;
      margin-bottom: 4px;
    }

    .dangle-pendulum {
      position: absolute;
      top: 6px;
      left: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: top center;
      animation: pendulumSwing 2.4s ease-in-out infinite;
      z-index: 1;
    }

    .dangle-thread {
      width: 2px;
      height: 195px;
      background: rgba(255, 255, 255, 0.85);
    }

    .dangle-spider {
      width: 68px;
      object-fit: contain;
      margin-top: -20px;
    }

    @keyframes pendulumSwing {
      0%, 100% { transform: translateX(-50%) rotate(-14deg); }
      50% { transform: translateX(-50%) rotate(14deg); }
    }

    .splash-title {
      color: #ffffff;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .splash-status {
      color: #999999;
      font-size: 0.8rem;
      margin-bottom: 16px;
      min-height: 1.1em;
      text-align: center;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="splash-card">
    <img class="splash-logo" src="assets/spydernombre.png" alt="Spyder Client">
    <div class="dangle-wrap">
      <div class="dangle-pendulum">
        <div class="dangle-thread"></div>
        <img class="dangle-spider" src="assets/aranasinfondo.png" alt="">
      </div>
    </div>
    <div class="splash-title">Spyder Client</div>
    <div class="splash-status" id="splashStatus">Tejiendo Redes...</div>
    <div class="spinner"></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const splashStatus = document.getElementById('splashStatus');

    ipcRenderer.on('splash-status', (event, text) => {
      splashStatus.innerText = text;
    });
  </script>
</body>
</html>
